name: Release

# Runs after the Docker workflow rather than on the tag itself, so a release is
# never announced for images that failed to build or publish.
on:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-release:
    name: create the GitHub Release
    runs-on: ubuntu-latest
    # workflow_run.head_branch carries the tag name for a tag push.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    permissions:
      contents: write
    steps:
      - name: create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          # gh ranks "Latest" by SemVer, where v0.4.0-rc0 outranks v0.3.3: a
          # hyphenated tag must be a pre-release or an rc becomes Latest.
          args=(--generate-notes --verify-tag --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
