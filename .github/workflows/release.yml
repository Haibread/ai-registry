name: Release

# Runs after the Docker workflow rather than on the tag itself, so a release is
# never announced for images that failed to build or publish.
on:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-release:
    name: create the GitHub Release
    runs-on: ubuntu-latest
    # workflow_run.head_branch carries the tag name for a tag push. A
    # pre-release tag (vX.Y.Z-rcN) only publishes images, for testing.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    permissions:
      contents: write
    steps:
      - name: create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          args=(--generate-notes --verify-tag --title "$TAG")
          # Without a start tag, GitHub diffs against the previous release,
          # which may be an older rc: the notes would then miss everything
          # already shipped in it.
          previous="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
              | sed 's|^refs/tags/||' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | { cat; echo "$TAG"; } \
              | sort -Vu \
              | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }'
          )"
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"

  # Pages deploys from main only: rebuild there so the root serves the new
  # release and /next/ stays main.
  docs:
    name: rebuild the documentation site
    needs:
      - github-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: dispatch the docs workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
