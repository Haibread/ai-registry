name: Helm publish

# Validates, then publishes the chart to GHCR as an OCI artifact.
#   chart-X.Y.Z tag → chart version X.Y.Z, appVersion as committed in Chart.yaml
#   push to main    → chart version 0.0.0-main.g<short-sha>, appVersion main-<short-sha>
on:
  push:
    branches:
      - main
    tags:
      - 'chart-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xzf - kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: validate the chart
        run: deploy/helm/validate.sh

      - name: compute chart and app versions
        id: versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            chart_version="${REF_NAME#chart-}"
            app_version=$(awk -F'"' '/^appVersion:/ {print $2}' deploy/helm/ai-registry/Chart.yaml)
            committed=$(awk '/^version:/ {print $2}' deploy/helm/ai-registry/Chart.yaml)
            if [[ "$committed" != "$chart_version" ]]; then
              echo "Chart.yaml says ${committed} but the tag says ${chart_version}." >&2
              echo "Cut releases with scripts/release.sh so the two stay in step." >&2
              exit 1
            fi
          else
            branch="${REF_NAME//\//-}"
            short_sha="${SHA:0:7}"
            # The 'g' keeps the identifier non-numeric: SemVer rejects a numeric
            # pre-release identifier with a leading zero (an all-digit "0659112").
            chart_version="0.0.0-${branch}.g${short_sha}"
            app_version="${branch}-${short_sha}"
          fi
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      # helm package overrides both fields, but the tarball's Chart.yaml would
      # otherwise still carry the committed values seen by `helm show chart`.
      - name: stamp Chart.yaml
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
        run: |
          sed -i -E \
            -e "s/^version:.*/version: ${CHART_VERSION}/" \
            -e "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" \
            deploy/helm/ai-registry/Chart.yaml
          grep -E '^(version|appVersion):' deploy/helm/ai-registry/Chart.yaml

      - name: package the chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
        run: |
          helm package deploy/helm/ai-registry \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination "$RUNNER_TEMP/chart"

      - name: log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USER" --password-stdin

      - name: push the chart to GHCR
        run: |
          helm push "$RUNNER_TEMP"/chart/*.tgz \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-registry/charts"
