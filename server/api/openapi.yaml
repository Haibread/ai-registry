openapi: 3.1.0
info:
  title: AI Registry API
  description: >
    Centralized registry for MCP servers and AI agents.
    Exposes a versioned HTTP API; all UIs are clients of this API.
  version: 0.1.0
  contact:
    name: AI Registry Team
servers:
  - url: /
    description: Current host

tags:
  - name: system
    description: Health, readiness, and observability
  - name: publishers
    description: Publisher management (admin only)
  - name: mcp
    description: MCP server registry (v1)
  - name: agents
    description: AI agent registry (v1)
  - name: audit
    description: Audit log (admin only)
  - name: v0
    description: MCP registry wire-format (spec-compatible /v0 surface)

paths:
  # ── System ───────────────────────────────────────────────────────────────

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: Returns 200 when the process is alive.
      tags: [system]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: Returns 200 when the service is ready to accept traffic (DB reachable).
      tags: [system]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics (admin only)
      description: Exposes Prometheus-format metrics for scraping.
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /openapi.yaml:
    get:
      operationId: openapiSpec
      summary: OpenAPI 3.1 specification
      tags: [system]
      responses:
        "200":
          description: OpenAPI spec in YAML
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      operationId: apiDocs
      summary: Interactive API reference (Scalar UI)
      tags: [system]
      responses:
        "200":
          description: HTML page with interactive API docs
          content:
            text/html:
              schema:
                type: string

  /.well-known/oauth-protected-resource:
    get:
      operationId: oauthProtectedResource
      summary: MCP OAuth 2.0 Protected Resource Metadata
      description: RFC 8707 resource metadata required by the MCP authorization spec.
      tags: [system]
      responses:
        "200":
          description: Resource metadata
          content:
            application/json:
              schema:
                type: object

  /.well-known/agent-card.json:
    get:
      operationId: globalAgentCard
      summary: Global registry A2A Agent Card
      description: >
        Returns the Google A2A-compatible Agent Card for the registry itself,
        making the registry a first-class A2A citizen.
      tags: [agents]
      responses:
        "200":
          description: A2A Agent Card
          content:
            application/json:
              schema:
                type: object

  /.well-known/jwks.json:
    get:
      operationId: registryJWKS
      summary: Registry JSON Web Key Set
      description: >
        Public keys for verifying registry-issued local access tokens.
        Empty `keys` when local login is disabled.
      tags: [system]
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object

  # ── Authentication ─────────────────────────────────────────────────────────

  /api/v1/auth/login:
    post:
      operationId: localLogin
      summary: Local email + password login
      description: >
        Exchanges an email and password for a short-lived, registry-signed
        access token. Local tokens are accepted only on the
        human/admin API — they are rejected on the MCP surface, which stays
        OAuth-only. Available only when local login is enabled.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: A registry-issued access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Too many failed login attempts; retry later
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me:
    get:
      operationId: getMe
      summary: Resolved identity and effective role grants for the caller
      description: >
        Returns the authenticated caller's identity together with their
        effective role grants, so a client can gate the admin UI by
        role without trusting any client-side claim. Grants include both
        per-publisher grants (with the publisher slug/name) and global grants
        (empty publisher fields). `is_server_admin` short-circuits every
        publisher-scoped check. Works for both OIDC and local tokens.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's identity and grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── RBAC administration ─────────────────────────────────────────────────────

  /api/v1/groups:
    get:
      operationId: listGroups
      summary: List groups (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      summary: Create a group (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: The created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/groups/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroup
      summary: Get a group by slug (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchGroup
      summary: Update a group (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchGroupRequest" }
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteGroup
      summary: Delete a group (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{slug}/members:
    get:
      operationId: listGroupMembers
      summary: List a group's members (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group's members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{slug}/members/{email}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: email
        in: path
        required: true
        schema: { type: string, format: email }
    put:
      operationId: addGroupMember
      summary: Add a member to a group by email (Server Admin)
      description: Auto-creates an invited user when the email is unknown.
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The added (or auto-created) user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      summary: Create a local or invited user (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: The created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUser
      summary: Get a user by id (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchUser
      summary: Update a user's display name, disabled, or is_server_admin (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchUserRequest" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{id}/set-password:
    post:
      operationId: setUserPassword
      summary: Set a user's password (self or Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "204":
          description: Password set
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/grants:
    get:
      operationId: listGlobalGrants
      summary: List global (all-publishers) role grants (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Global grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrantList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGlobalGrant
      summary: Create a global role grant (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: The created grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/grants/{id}:
    delete:
      operationId: deleteGlobalGrant
      summary: Delete a global role grant (Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/publishers/{slug}/grants:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listPublisherGrants
      summary: List a publisher's role grants (publisher Admin or Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The publisher's grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrantList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createPublisherGrant
      summary: Grant a role on a publisher (publisher Admin or Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: The created grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/publishers/{slug}/grants/{id}:
    delete:
      operationId: deletePublisherGrant
      summary: Revoke a role grant on a publisher (publisher Admin or Server Admin)
      tags: [rbac]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Publishers ────────────────────────────────────────────────────────────

  # ── Review queue ───────────────────────────────────────────────────────────

  /api/v1/review-queue:
    get:
      operationId: listReviewQueue
      summary: List pending review items for the caller's publishers (reviewer)
      description: >
        Returns versions in `pending_review` and entries with pending
        deletions, newest first, paginated. The discriminator `kind`
        identifies the row type so the client can render the right action
        affordances. The result is scoped to the caller's reviewer authority:
        a Server Admin or a holder of a global Reviewer grant sees every
        publisher's items; a per-publisher Reviewer sees only the publishers
        they review; a caller who holds no Reviewer role anywhere gets 403.
      tags: [review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueueList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/publishers:
    get:
      operationId: listPublishers
      summary: List publishers
      tags: [publishers]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated list of publishers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherList"
    post:
      operationId: createPublisher
      summary: Create a publisher (admin only)
      tags: [publishers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublisherRequest"
      responses:
        "201":
          description: Publisher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/publishers/{slug}:
    get:
      operationId: getPublisher
      summary: Get a publisher by slug
      tags: [publishers]
      parameters:
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: Publisher detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchPublisher
      summary: Update a publisher's metadata (publisher Admin)
      description: >
        Updates the publisher's display name and contact. Requires the Admin
        role on this publisher, or global Server Admin. Returns 403 for any
        lesser role, 401 when unauthenticated.
      tags: [publishers]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the publisher
                contact:
                  type: string
                  description: Contact email or URL
      responses:
        "200":
          description: Updated publisher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deletePublisher
      summary: Delete a publisher (admin only)
      description: Hard-deletes the publisher. Returns 409 if the publisher still owns active MCP servers or agents.
      tags: [publishers]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: Publisher deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/publishers/{slug}/stats:
    get:
      operationId: getPublisherStats
      summary: Per-publisher stats for the scoped admin home (member)
      description: >
        Resource counts + status breakdowns, member counts by role, and the
        pending-review count, scoped to one publisher. Open to any member of the
        publisher (Viewer and up) or a Server Admin; others get 403. This is the
        per-publisher counterpart to the Server-Admin-only global stats.
      tags: [publishers]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: Per-publisher stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/publishers/{slug}/activity:
    get:
      operationId: getPublisherActivity
      summary: Per-publisher activity feed (member)
      description: >
        The audit feed for a single publisher, newest first, paginated. Covers
        the lifecycle of every MCP server and agent under the publisher. Open to
        any member of the publisher (Viewer and up) or a Server Admin; others get
        403. Unlike the public per-resource feed, this members-only feed names
        the actor (the publisher's own collaborators).
      tags: [publishers]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated publisher activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── MCP Servers ───────────────────────────────────────────────────────────

  /api/v1/mcp/servers:
    get:
      operationId: listMCPServers
      summary: List MCP servers
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: q
          in: query
          description: Full-text search query (prefix matching)
          schema:
            type: string
        - name: namespace
          in: query
          description: Filter by publisher slug
          schema:
            type: string
        - name: mine
          in: query
          description: >-
            Scope the listing to resources the authenticated caller can manage.
            Server Admins and global-grant holders see every
            publisher; an author sees only the publishers they hold a role on,
            including their own private/draft entries; a caller with no grants
            sees nothing. Requires authentication (401 otherwise).
          schema:
            type: boolean
        - name: status
          in: query
          description: Filter by lifecycle status
          schema:
            type: string
            enum: [draft, published, deprecated]
        - name: visibility
          in: query
          description: Filter by visibility (admin only — public requests always see public entries only)
          schema:
            type: string
            enum: [public, private]
        - name: transport
          in: query
          description: Filter by transport type of the latest published version's packages
          schema:
            type: string
            enum: [stdio, sse, streamable_http]
        - name: registry_type
          in: query
          description: Filter by package registry/ecosystem type (e.g. npm, pip, docker)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order for results (ignored when q is provided — search results are ranked by relevance)
          schema:
            type: string
            enum: [created_at_desc, updated_at_desc, published_at_desc, name_asc, name_desc]
            default: created_at_desc
        - name: featured
          in: query
          description: Filter by featured status
          schema:
            type: boolean
        - name: tag
          in: query
          description: Filter by tag (exact match, single tag)
          schema:
            type: string
        - name: published_since
          in: query
          description: Filter to entries whose latest version was published after this ISO 8601 date-time (e.g. 2025-01-01T00:00:00Z)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated list of MCP servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerList"
    post:
      operationId: createMCPServer
      summary: Create an MCP server entry (publisher Editor)
      description: >
        Creates a server under the publisher named by `namespace`. Requires the
        Editor role on that publisher (Admin / Server Admin satisfy it via the
        lattice). The new server is private + draft, so it only reaches the
        public catalog once a version is published and an Admin flips visibility
        — the approval gate stays intact. 401 when unauthenticated,
        403 without the role.
      tags: [mcp]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMCPServerRequest"
      responses:
        "201":
          description: MCP server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/mcp/servers/{namespace}/{slug}:
    get:
      operationId: getMCPServer
      summary: Get an MCP server by namespace/slug
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: MCP server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchMCPServer
      summary: Update an MCP server's metadata (admin only)
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                homepage_url:
                  type: string
                repo_url:
                  type: string
                license:
                  type: string
      responses:
        "200":
          description: Updated MCP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteMCPServer
      summary: Force-delete an MCP server (admin only — bypasses workflow)
      description: |
        Admin-only escape hatch that hard-tombstones the server and all its
        versions to status='deleted' without going through the
        change-approval workflow. Publisher Editors must use
        POST /api/v1/mcp/servers/{namespace}/{slug}/deletion-request and
        wait for a reviewer's approve to delete; this endpoint is the
        admin force-delete path.
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: MCP server deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcp/servers/{namespace}/{slug}/visibility:
    post:
      operationId: setMCPServerVisibility
      summary: Set MCP server visibility (Editor/Admin)
      description: >
        Requires the Editor role on the owning publisher (Admin / Server Admin
        satisfy it). Switching to `public` requires the entry to already have an
        approved (published) version — an unreviewed draft cannot be exposed, so
        a `public` request on a draft returns 409. Switching back to `private`
        is always allowed.
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: Visibility updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  visibility:
                    type: string
                    enum: [public, private]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot make public — the entry has no approved (published) version yet
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/mcp/servers/{namespace}/{slug}/deprecate:
    post:
      operationId: deprecateMCPServer
      summary: Deprecate an MCP server (admin only)
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: Server deprecated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/mcp/servers/{namespace}/{slug}/view:
    post:
      operationId: recordMCPServerView
      summary: Record a view event for an MCP server (fire-and-forget)
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: View recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcp/servers/{namespace}/{slug}/copy:
    post:
      operationId: recordMCPServerCopy
      summary: Record a copy event for an MCP server (fire-and-forget)
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: Copy recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcp/servers/{namespace}/{slug}/activity:
    get:
      operationId: listMCPServerActivity
      summary: Public activity feed for an MCP server
      description: >
        Returns a chronological feed of lifecycle events for the given
        server (creation, publish, deprecation, visibility changes, etc.).
        Actor identity is scrubbed — only a coarse role label is exposed.
        Public, rate-limited.
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated list of public activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActivityEventList"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/mcp/servers/{namespace}/{slug}/versions:
    get:
      operationId: listMCPServerVersions
      summary: List versions of an MCP server
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMCPServerVersion
      summary: Create a new version of an MCP server (admin only)
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMCPServerVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}:
    get:
      operationId: getMCPServerVersion
      summary: Get a specific version of an MCP server
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── MCP server change-approval workflow ───────────────────────────────────

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}/submit:
    post:
      operationId: submitMCPVersion
      summary: Submit an MCP server version for review
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "204": { description: submitted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            review-state-mismatch (already pending, withdrawn, or
            published) | review-already-pending (another version on
            this entry is already pending review).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}/withdraw:
    post:
      operationId: withdrawMCPVersion
      summary: Withdraw a pending MCP server version back to draft
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "204": { description: withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch (version is not in pending_review)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}/approve:
    post:
      operationId: approveMCPVersion
      summary: Approve a pending MCP server version (reviewer)
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRequest" }
      responses:
        "204": { description: approved (version is now published) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            review-state-mismatch (no longer pending) |
            review-revision-mismatch (revision body field stale) |
            already-published (already approved by another reviewer).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}/reject:
    post:
      operationId: rejectMCPVersion
      summary: Reject a pending MCP server version with a reason (reviewer)
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
      responses:
        "204": { description: rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch | review-revision-mismatch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/mcp/servers/{namespace}/{slug}/deletion-request:
    post:
      operationId: requestMCPDeletion
      summary: Request deletion of an MCP server
      description: >
        Marks the entry as having a pending deletion review. The entry
        stays visible on public reads until a reviewer approves the
        deletion (which sets deleted_at).
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "202": { description: deletion request recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: another deletion request is already pending
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/mcp/servers/{namespace}/{slug}/deletion-request/approve:
    post:
      operationId: approveMCPDeletion
      summary: Approve a pending MCP server deletion (reviewer)
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204": { description: deleted (soft-delete via deleted_at) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: no pending deletion request to approve
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/mcp/servers/{namespace}/{slug}/deletion-request/reject:
    post:
      operationId: rejectMCPDeletion
      summary: Reject a pending MCP server deletion with a reason (reviewer)
      tags: [mcp, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDeletionRequest" }
      responses:
        "204": { description: rejected (request markers cleared) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: no pending deletion request to reject
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/mcp/servers/{namespace}/{slug}/versions/{version}/publish:
    post:
      operationId: publishMCPServerVersion
      summary: Publish a version (Reviewer)
      description: >
        Transitions the version from draft to published. Publishing takes a
        version live, so it is an approver action: requires the Reviewer role on
        the owning publisher (the global Server Admin is the break-glass
        exception). Editors take a version live by submitting it for a Reviewer
        to approve. Published versions are immutable — metadata edits after
        publish are forbidden.
      tags: [mcp]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "200":
          description: Version published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Agents ────────────────────────────────────────────────────────────────

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List agents
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: q
          in: query
          description: Full-text search query (prefix matching)
          schema:
            type: string
        - name: namespace
          in: query
          description: Filter by publisher slug
          schema:
            type: string
        - name: mine
          in: query
          description: >-
            Scope the listing to resources the authenticated caller can manage.
            Server Admins and global-grant holders see every
            publisher; an author sees only the publishers they hold a role on,
            including their own private/draft entries; a caller with no grants
            sees nothing. Requires authentication (401 otherwise).
          schema:
            type: boolean
        - name: status
          in: query
          description: Filter by lifecycle status
          schema:
            type: string
            enum: [draft, published, deprecated]
        - name: visibility
          in: query
          description: Filter by visibility (admin only)
          schema:
            type: string
            enum: [public, private]
        - name: sort
          in: query
          description: Sort order for results (ignored when q is provided — search results are ranked by relevance)
          schema:
            type: string
            enum: [created_at_desc, updated_at_desc, published_at_desc, name_asc, name_desc]
            default: created_at_desc
        - name: featured
          in: query
          description: Filter by featured status
          schema:
            type: boolean
        - name: tag
          in: query
          description: Filter by tag (exact match, single tag)
          schema:
            type: string
        - name: published_since
          in: query
          description: Filter to entries whose latest version was published after this ISO 8601 date-time (e.g. 2025-01-01T00:00:00Z)
          schema:
            type: string
            format: date-time
