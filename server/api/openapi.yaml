            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteAgent
      summary: Force-delete an agent (admin only — bypasses workflow)
      description: |
        Admin-only escape hatch that hard-tombstones the agent and all its
        versions to status='deleted' without going through the
        change-approval workflow. Publisher Editors must use
        POST /api/v1/agents/{namespace}/{slug}/deletion-request and wait
        for a reviewer's approve to delete; this endpoint is the admin
        force-delete path.
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: Agent deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{namespace}/{slug}/visibility:
    post:
      operationId: setAgentVisibility
      summary: Set agent visibility (Editor/Admin)
      description: >
        Requires the Editor role on the owning publisher (Admin / Server Admin
        satisfy it). Switching to `public` requires an approved (published)
        version — a `public` request on a draft returns 409. Switching back to
        `private` is always allowed.
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: Visibility updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  visibility:
                    type: string
                    enum: [public, private]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot make public — the entry has no approved (published) version yet
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/agents/{namespace}/{slug}/deprecate:
    post:
      operationId: deprecateAgent
      summary: Deprecate an agent (admin only)
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: Agent deprecated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/{namespace}/{slug}/view:
    post:
      operationId: recordAgentView
      summary: Record a view event for an agent (fire-and-forget)
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: View recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{namespace}/{slug}/copy:
    post:
      operationId: recordAgentCopy
      summary: Record a copy event for an agent (fire-and-forget)
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204":
          description: Copy recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{namespace}/{slug}/activity:
    get:
      operationId: listAgentActivity
      summary: Public activity feed for an agent
      description: >
        Returns a chronological feed of lifecycle events for the given
        agent (creation, publish, deprecation, visibility changes, etc.).
        Actor identity is scrubbed — only a coarse role label is exposed.
        Public, rate-limited.
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated list of public activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActivityEventList"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/agents/{namespace}/{slug}/versions:
    get:
      operationId: listAgentVersions
      summary: List versions of an agent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAgentVersion
      summary: Create a new version of an agent (admin only)
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/agents/{namespace}/{slug}/versions/{version}:
    get:
      operationId: getAgentVersion
      summary: Get a specific version of an agent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Agent change-approval workflow ────────────────────────────────────────

  /api/v1/agents/{namespace}/{slug}/versions/{version}/submit:
    post:
      operationId: submitAgentVersion
      summary: Submit an agent version for review
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "204": { description: submitted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch | review-already-pending
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/agents/{namespace}/{slug}/versions/{version}/withdraw:
    post:
      operationId: withdrawAgentVersion
      summary: Withdraw a pending agent version back to draft
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "204": { description: withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch (version is not in pending_review)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/agents/{namespace}/{slug}/versions/{version}/approve:
    post:
      operationId: approveAgentVersion
      summary: Approve a pending agent version (reviewer)
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRequest" }
      responses:
        "204": { description: approved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch | review-revision-mismatch | already-published
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/agents/{namespace}/{slug}/versions/{version}/reject:
    post:
      operationId: rejectAgentVersion
      summary: Reject a pending agent version with a reason (reviewer)
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
      responses:
        "204": { description: rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: review-state-mismatch | review-revision-mismatch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/agents/{namespace}/{slug}/deletion-request:
    post:
      operationId: requestAgentDeletion
      summary: Request deletion of an agent
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "202": { description: deletion request recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: another deletion request is already pending
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/agents/{namespace}/{slug}/deletion-request/approve:
    post:
      operationId: approveAgentDeletion
      summary: Approve a pending agent deletion (reviewer)
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "204": { description: deleted (soft-delete) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: no pending deletion request
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }

  /api/v1/agents/{namespace}/{slug}/deletion-request/reject:
    post:
      operationId: rejectAgentDeletion
      summary: Reject a pending agent deletion with a reason (reviewer)
      tags: [agents, review]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDeletionRequest" }
      responses:
        "204": { description: rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: no pending deletion request
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ReviewProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/agents/{namespace}/{slug}/versions/{version}/publish:
    post:
      operationId: publishAgentVersion
      summary: Publish an agent version (Reviewer)
      description: >
        Transitions the version from draft to published. Publishing takes a
        version live, so it is an approver action: requires the Reviewer role
        (Server Admin is the break-glass exception). Editors publish by
        submitting for a Reviewer to approve. Published versions are immutable.
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "200":
          description: Version published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/{namespace}/{slug}/versions/{version}/status:
    patch:
      operationId: patchAgentVersionStatus
      summary: Update agent version lifecycle status (admin only)
      tags: [agents]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVersionStatusRequest"
      responses:
        "200":
          description: Status updated; returns the updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── Per-agent A2A card ────────────────────────────────────────────────────

  /agents/{namespace}/{slug}/.well-known/agent-card.json:
    get:
      operationId: getAgentCard
      summary: A2A Agent Card
      description: Returns the Google A2A-compatible Agent Card for the given agent.
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: A2A Agent Card
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Stats & Audit ─────────────────────────────────────────────────────────

  /api/v1/public-stats:
    get:
      operationId: getPublicStats
      summary: Public registry statistics (published entries only)
      tags: [system]
      responses:
        "200":
          description: Public counts for each resource type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /api/v1/changelog:
    get:
      operationId: getChangelog
      summary: Recently published versions across MCP servers and agents
      description: >
        Aggregated timeline of version publications, newest first. Only
        published versions of public, non-deleted entries are returned.
      tags: [system]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent version publications across the registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangelogList"

  /api/v1/stats:
    get:
      operationId: getStats
      summary: Registry resource counts (admin only)
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Total counts for each resource type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit:
    get:
      operationId: listAuditEvents
      summary: List audit log events (admin only)
      tags: [audit]
      security:
        - bearerAuth: []
      parameters:
        - name: resource_type
          in: query
          description: Filter by resource type (mcp_server, agent, publisher)
          schema:
            type: string
        - name: resource_id
          in: query
          description: Filter by resource ULID
          schema:
            type: string
        - name: actor
          in: query
          description: Filter by Keycloak subject UUID
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports:
    post:
      operationId: createReport
      summary: File a community issue report
      description: >
        Public, rate-limited endpoint for anyone to report problems with a
        registry entry (broken packaging, misleading description, spam,
        security concern, etc.). Admins triage reports via the admin queue.
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listReports
      summary: List community issue reports (admin only)
      tags: [reports]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, reviewed, dismissed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports/{id}:
    patch:
      operationId: updateReportStatus
      summary: Update a report's status (admin only)
      tags: [reports]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, reviewed, dismissed]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── v0 MCP registry wire-format ───────────────────────────────────────────

  /v0/servers:
    get:
      operationId: v0ListServers
      summary: List MCP servers (MCP registry wire format)
      description: >
        Returns the paginated server list in the canonical MCP registry wire
        format. Only public, published servers are returned.
      tags: [v0]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search (also accepts "q" for legacy compat)
          schema:
            type: string
        - name: updated_since
          in: query
          description: Return servers updated after this RFC 3339 timestamp
          schema:
            type: string
            format: date-time
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
        - name: version
          in: query
          description: Exact semver filter, or "latest"
          schema:
            type: string
      responses:
        "200":
          description: Paginated server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ListResponse"

  /v0/servers/{id}:
    get:
      operationId: v0GetServer
      summary: Get an MCP server by ULID (MCP registry wire format)
      tags: [v0]
      parameters:
        - $ref: "#/components/parameters/ServerIDParam"
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ServerResponse"
        "404":
          description: Server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

  /v0/servers/{namespace}/{slug}:
    get:
      operationId: v0GetServerByName
      summary: Get an MCP server by namespace/slug (MCP registry wire format)
      tags: [v0]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ServerResponse"
        "404":
          description: Server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

  /v0/servers/{namespace}/{slug}/versions:
    get:
      operationId: v0ListServerVersions
      summary: List published versions of an MCP server (MCP registry wire format)
      tags: [v0]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      responses:
        "200":
          description: List of published versions in wire format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ListResponse"
        "404":
          description: Server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

  /v0/servers/{namespace}/{slug}/versions/{version}:
    get:
      operationId: v0GetServerVersion
      summary: Get a specific version of an MCP server (MCP registry wire format)
      description: Use `latest` as the version value to get the latest published version.
      tags: [v0]
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "200":
          description: Version detail in wire format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ServerResponse"
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
    put:
      operationId: v0UpdateServerVersion
      summary: Update a server version (admin only) — not yet implemented
      tags: [v0]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: v0DeleteServerVersion
      summary: Delete a server version (admin only) — not yet implemented
      tags: [v0]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v0/servers/{namespace}/{slug}/status:
    patch:
      operationId: v0PatchServerStatus
      summary: Update status for all published versions of a server (admin only)
      tags: [v0]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V0StatusPatchRequest"
      responses:
        "200":
          description: All versions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0AllVersionsStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

  /v0/servers/{namespace}/{slug}/versions/{version}/status:
    patch:
      operationId: v0PatchVersionStatus
      summary: Update status of a specific server version (admin only)
      tags: [v0]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/SlugParam"
        - $ref: "#/components/parameters/VersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V0StatusPatchRequest"
      responses:
        "200":
          description: Version status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ServerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Server or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

  /v0/publish:
    post:
      operationId: v0Publish
      summary: Publish an MCP server version (admin only, MCP registry wire format)
      description: >
        Creates or updates an MCP server entry and immediately publishes a
        version. The request body is the server.json shape directly (no wrapper).
        Auto-creates the server record if the publisher exists.
      tags: [v0]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V0PublishRequest"
      responses:
        "200":
          description: Server published; returns the full ServerResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ServerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
    NamespaceParam:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    VersionParam:
      name: version
      in: path
      required: true
      schema:
        type: string
    ServerIDParam:
      name: id
      in: path
      required: true
      description: ULID of the MCP server
      schema:
        type: string
    PublisherSlugParam:
      name: publisher_slug
      in: path
      required: true
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string

  schemas:
    # ── Authentication ────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Registry-signed bearer token (RS256), verifiable via /.well-known/jwks.json.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token lifetime in seconds.

    # ── RBAC ──────────────────────────────────────────────────────────────────

    Group:
      type: object
      required: [id, slug, name, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        next_cursor: { type: string }

    CreateGroupRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }

    PatchGroupRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    User:
      type: object
      required: [id, email, has_password, is_server_admin, disabled, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        subject:
          type: string
          description: OIDC subject; empty for local-only users.
        has_password: { type: boolean }
        is_server_admin: { type: boolean }
        disabled: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string }

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        password:
          type: string
          format: password
          description: Optional; omit to create an invited user that cannot log in until a credential is set.
        is_server_admin: { type: boolean }

    PatchUserRequest:
      type: object
      properties:
        display_name: { type: string }
        disabled: { type: boolean }
        is_server_admin: { type: boolean }

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 8 }

    RoleGrant:
      type: object
      required: [id, principal_type, principal_id, role, source, created_at]
      properties:
        id: { type: string }
        principal_type: { type: string, enum: [user, group] }
        principal_id: { type: string }
        principal_label:
          type: string
          description: Human handle for the principal — a user's email or a group's slug.
        publisher_id:
          type: string
          description: Empty for a global (all-publishers) grant.
        role: { type: string, enum: [viewer, editor, reviewer, admin] }
        source: { type: string, enum: [api, config] }
        created_at: { type: string, format: date-time }

    RoleGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }

    GrantRequest:
      type: object
      required: [principal_type, principal_id, role]
      properties:
        principal_type: { type: string, enum: [user, group] }
        principal_id: { type: string }
        role: { type: string, enum: [viewer, editor, reviewer, admin] }

    MeGrant:
      type: object
      required: [role]
      description: >
        An effective role grant held by the caller. Per-publisher grants carry
        the publisher slug/name; a global (all-publishers) grant leaves the
        publisher fields empty.
      properties:
        role: { type: string, enum: [viewer, editor, reviewer, admin] }
        publisher_id:
          type: string
          description: Empty for a global (all-publishers) grant.
        publisher_slug: { type: string }
        publisher_name: { type: string }

    Me:
      type: object
      required: [authenticated, is_server_admin, grants]
      description: Resolved identity and effective authorization for the caller.
      properties:
        authenticated: { type: boolean }
        user_id:
          type: string
          description: Registry users.id; empty for a federated caller with no provisioned row.
        email: { type: string, format: email }
        display_name: { type: string }
        is_server_admin:
          type: boolean
          description: When true, the caller satisfies every publisher-scoped role check.
        issuer:
          type: string
          enum: [oidc, local]
          description: Which front door authenticated the request.
        grants:
          type: array
          items: { $ref: "#/components/schemas/MeGrant" }

    # ── System ──────────────────────────────────────────────────────────────

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string

    StatusBreakdown:
      type: object
      properties:
        draft:
          type: integer
        published:
          type: integer
        deprecated:
          type: integer

    RegistryCounts:
      type: object
      required: [mcp_servers, agents, publishers]
      properties:
        mcp_servers:
          type: integer
        agents:
          type: integer
        publishers:
          type: integer
        mcp_status_breakdown:
          $ref: "#/components/schemas/StatusBreakdown"
        agent_status_breakdown:
          $ref: "#/components/schemas/StatusBreakdown"

    MemberRoles:
      type: object
      description: >
        Role-grant counts scoped to one publisher. A principal holding two roles
        (deliberate Editor + Reviewer dual-hatting) is counted under each, so
        these can exceed the distinct member total.
      required: [viewers, editors, reviewers, admins]
      properties:
        viewers:
          type: integer
        editors:
          type: integer
        reviewers:
          type: integer
        admins:
          type: integer

    PublisherStats:
      type: object
      description: >
        Per-publisher rollup for the scoped admin home. Totals exclude
        soft-deleted entries; breakdowns cover the three live statuses.
      required: [mcp_servers, agents, members, pending_review]
      properties:
        mcp_servers:
          type: integer
        agents:
          type: integer
        members:
          type: integer
          description: Distinct principals holding a grant scoped to this publisher.
        pending_review:
          type: integer
          description: Items awaiting an approver (submitted versions + requested deletions).
        mcp_status_breakdown:
          $ref: "#/components/schemas/StatusBreakdown"
        agent_status_breakdown:
          $ref: "#/components/schemas/StatusBreakdown"
        member_roles:
          $ref: "#/components/schemas/MemberRoles"

    PublicStats:
      type: object
      required:
        - mcp_servers
        - agents
        - publishers
        - new_mcp_servers_this_week
        - new_agents_this_week
        - new_publishers_this_week
      properties:
        mcp_servers:
          type: integer
          description: Total public published MCP servers
        agents:
          type: integer
          description: Total public published agents
        publishers:
          type: integer
          description: Total publishers with at least one public entry
        new_mcp_servers_this_week:
          type: integer
          description: MCP servers published in the last 7 days
        new_agents_this_week:
          type: integer
          description: Agents published in the last 7 days
        new_publishers_this_week:
          type: integer
          description: Publishers with at least one public entry that were created in the last 7 days

    # ── Publishers ──────────────────────────────────────────────────────────

    Publisher:
      type: object
      required: [id, slug, name, verified, created_at, updated_at]
      properties:
        id:
          type: string
          description: ULID
        slug:
          type: string
        name:
          type: string
        contact:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePublisherRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        name:
          type: string
        contact:
          type: string

    PublisherList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Publisher"
        next_cursor:
          type: string
        total_count:
          type: integer

    # ── Change-approval workflow ────────────────────────────────────────

    ApproveRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: |
            Revision the reviewer last loaded. The server compares this
            against the current row; mismatch returns 409 with type
            `https://registry/errors/review-revision-mismatch`.

    RejectRequest:
      type: object
      required: [revision, reason]
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          description: Free-text reason persisted on the rejected version row.

    RejectDeletionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: |
            Free-text reason for rejecting the pending deletion. The
            entry's `deletion_requested_*` columns are cleared on
            success; the reason is captured in the audit log.

    ReviewQueueItem:
      type: object
      required: [kind, publisher_slug, entry_slug, entry_id, submitted_at]
      properties:
        kind:
          type: string
          enum: [mcp_version, agent_version, mcp_deletion, agent_deletion]
        publisher_slug: { type: string }
        entry_slug: { type: string }
        entry_id: { type: string, description: ULID of the entry }
        version:
          type: string
          description: |
            Present on `*_version` items, absent on `*_deletion` items.
        revision:
          type: integer
          description: |
            Present on `*_version` items only.
        submitted_at: { type: string, format: date-time }
        submitted_by:
          type: string
          description: JWT subject of the submitter (UUID).
        submitted_by_email:
          type: string
          description: Email captured at submission time.

    ReviewQueueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
        next_cursor:
          type: string

    ReviewProblem:
      description: |
        RFC 7807 problem detail returned by the change-approval
        workflow. Inspect `type` to discriminate the case:
          .../errors/not-found                       (404)
          .../errors/review-state-mismatch           (409)
          .../errors/review-revision-mismatch        (409)
          .../errors/review-already-pending          (409)
          .../errors/already-published               (409)
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        instance: { type: string }

    # ── MCP Servers ─────────────────────────────────────────────────────────

    PackageTransport:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [stdio, http, sse, streamable_http]
        url:
          type: string

    PackageEntry:
      type: object
      required: [registryType, identifier, version, transport]
      properties:
        registryType:
          type: string
        registryBaseUrl:
          type: string
        identifier:
          type: string
        version:
          type: string
        transport:
          $ref: "#/components/schemas/PackageTransport"

    MCPTool:
      type: object
      description: >
        Publisher-declared tool exposed by an MCP server. This is a registry
        extension — the MCP spec itself returns the live tool list at runtime
        via the `tools/list` method. Storing the declared list here lets the
        UI show tool counts and descriptions without connecting to a running
        server. Structural requirements: `name` is required and unique within
        the enclosing array; `input_schema`, if present, must be a JSON
        Schema object.
      required: [name]
      properties:
        name:
          type: string
          description: Unique tool name within the server
        description:
          type: string
          description: Human-readable tool description
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema describing the tool's input arguments
        annotations:
          type: object
          additionalProperties: true
          description: MCP spec tool annotations (e.g. destructive, idempotent)

    MCPServerLatestVersion:
      type: object
      required: [version, runtime, protocol_version]
      properties:
        version:
          type: string
        runtime:
          type: string
          enum: [stdio, http, sse, streamable_http]
        protocol_version:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageEntry"
        capabilities:
          type: object
          additionalProperties: true
          description: >
            MCP capability-negotiation object (e.g. `{tools:{listChanged:true}}`).
            NOT a list of tools — see the `tools` field for that.
        tools:
          type: array
          description: Publisher-declared list of tools this server exposes.
          items:
            $ref: "#/components/schemas/MCPTool"
        published_at:
          type: string
          format: date-time

    MCPServer:
      type: object
      required: [id, namespace, slug, name, visibility, status, created_at, updated_at]
      properties:
        id:
          type: string
        namespace:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        homepage_url:
          type: string
        repo_url:
          type: string
        license:
          type: string
        visibility:
          type: string
          enum: [private, public]
        status:
          type: string
          # MCPServer.status mirrors the lifecycle column on the row:
          # `draft` (never published), `published` (at least one version
          # active), `deprecated` (all versions superseded), or `deleted`
          # (soft-deleted tombstone). Public list responses exclude
          # `deleted`; admin reads and detail by namespace/slug can
          # still surface a deleted parent.
          enum: [draft, published, deprecated, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        featured:
          type: boolean
          default: false
        verified:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string
        readme:
          type: string
          description: Long-form README content (Markdown)
        view_count:
          type: integer
          description: Number of times this server has been viewed
        copy_count:
          type: integer
          description: Number of times this server's config has been copied
        latest_version:
          $ref: "#/components/schemas/MCPServerLatestVersion"

    CreateMCPServerRequest:
      type: object
      required: [namespace, slug, name]
      properties:
        namespace:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        name:
          type: string
        description:
          type: string
        homepage_url:
          type: string
        repo_url:
          type: string
        license:
          type: string

    MCPServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPServer"
        next_cursor:
          type: string
        total_count:
          type: integer

    MCPServerVersion:
      type: object
      required: [id, version, runtime, protocol_version, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: ULID
        version:
          type: string
          description: Semver string (e.g. 1.2.3)
        runtime:
          type: string
          enum: [stdio, http, sse, streamable_http]
        protocol_version:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageEntry"
        capabilities:
          type: object
          additionalProperties: true
        tools:
          type: array
          description: Publisher-declared list of tools this server exposes.
          items:
            $ref: "#/components/schemas/MCPTool"
        checksum:
          type: string
        signature:
          type: string
        status:
          type: string
          # MCPServerVersion lifecycle is orthogonal to MCPServer.status:
          # a version becomes `active` when published, `deprecated` when
          # superseded, or `deleted` when withdrawn. Draft / pending /
          # rejected states live on `review_state`, not here.
          enum: [active, deprecated, deleted]
        published_at:
          type: string
          format: date-time
        review_state:
          type: string
          enum: [none, pending_review, rejected]
          description: |
            Change-approval workflow state, orthogonal to `status` and
            `published_at`. Omitted on rows that have never been part of
            the workflow (review_state='none' before any submit).
        revision:
          type: integer
          minimum: 1
          description: |
            Revision counter the reviewer must echo back when calling
            approve/reject; bumps on every content edit.
        submitted_at:
          type: string
          format: date-time
        submitted_by:
          type: string
          description: JWT subject (UUID) of the submitter.
        submitted_by_email:
          type: string
          description: Email captured at submission time.
        reviewed_at:
          type: string
          format: date-time
        reviewed_by:
          type: string
        reviewed_by_email:
          type: string
        review_decision:
          type: string
          enum: [approved, rejected]
        rejection_reason:
          type: string
          description: Free-text reason persisted on the rejected version row.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MCPServerVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPServerVersion"

    CreateMCPServerVersionRequest:
      type: object
      required: [version, runtime, protocol_version]
      properties:
        version:
          type: string
          description: Semver string (e.g. 1.2.3)
        runtime:
          type: string
          enum: [stdio, http, sse, streamable_http]
        protocol_version:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageEntry"
        capabilities:
          type: object
          additionalProperties: true
        tools:
          type: array
          description: Publisher-declared list of tools this server exposes.
          items:
            $ref: "#/components/schemas/MCPTool"
        checksum:
          type: string
        signature:
          type: string

    # ── Agents ──────────────────────────────────────────────────────────────

    AgentSkill:
      type: object
      required: [id, name, description, tags]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string

    AgentLatestVersion:
      type: object
      required: [version, endpoint_url]
      properties:
        version:
          type: string
        endpoint_url:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"
        default_input_modes:
          type: array
          items:
            type: string
        default_output_modes:
          type: array
          items:
            type: string
        authentication:
          type: array
          items:
            type: object
        protocol_version:
          type: string
        published_at:
          type: string
          format: date-time

    Agent:
      type: object
      required: [id, namespace, slug, name, visibility, status, created_at, updated_at]
      properties:
        id:
          type: string
        namespace:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [private, public]
        status:
          type: string
          # Agent.status mirrors the lifecycle column on the row:
          # `draft` (never published), `published` (at least one version
          # active), `deprecated` (all versions superseded), or `deleted`
          # (soft-deleted tombstone). Public list responses exclude
          # `deleted`; admin reads and detail by namespace/slug can
          # still surface a deleted parent.
          enum: [draft, published, deprecated, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        featured:
          type: boolean
          default: false
        verified:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string
        readme:
          type: string
          description: Long-form README content (Markdown)
        view_count:
          type: integer
          description: Number of times this agent has been viewed
        copy_count:
          type: integer
          description: Number of times this agent's config has been copied
        latest_version:
          $ref: "#/components/schemas/AgentLatestVersion"

    CreateAgentRequest:
      type: object
      required: [namespace, slug, name]
      properties:
        namespace:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        name:
          type: string
        description:
          type: string

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        next_cursor:
          type: string
        total_count:
          type: integer

    AgentVersion:
      type: object
      required: [id, version, endpoint_url, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: ULID
        version:
          type: string
        endpoint_url:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"
        capabilities:
          type: object
          additionalProperties: true
        authentication:
          type: array
          items:
            type: object
        default_input_modes:
          type: array
          items:
            type: string
        default_output_modes:
          type: array
          items:
            type: string
        provider:
          type: object
          additionalProperties: true
        documentation_url:
          type: string
        icon_url:
          type: string
        protocol_version:
          type: string
        status:
          type: string
          # AgentVersion lifecycle mirrors MCPServerVersion: a version
          # becomes `active` on publish, `deprecated` when superseded,
          # `deleted` when withdrawn. Pre-publish / pending / rejected
          # states live on `review_state`.
          enum: [active, deprecated, deleted]
        status_message:
          type: string
        published_at:
          type: string
          format: date-time
        review_state:
          type: string
          enum: [none, pending_review, rejected]
        revision:
          type: integer
          minimum: 1
        submitted_at:
          type: string
          format: date-time
        submitted_by:
          type: string
        submitted_by_email:
          type: string
        reviewed_at:
          type: string
          format: date-time
        reviewed_by:
          type: string
        reviewed_by_email:
          type: string
        review_decision:
          type: string
          enum: [approved, rejected]
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentVersion"

    CreateAgentVersionRequest:
      type: object
      required: [version, endpoint_url]
      properties:
        version:
          type: string
        endpoint_url:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"
        capabilities:
          type: object
          additionalProperties: true
        authentication:
          type: array
          items:
            type: object
        default_input_modes:
          type: array
          items:
            type: string
        default_output_modes:
          type: array
          items:
            type: string
        provider:
          type: object
          additionalProperties: true
        documentation_url:
          type: string
        icon_url:
          type: string
        protocol_version:
          type: string

    PatchVersionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, deprecated, deleted]
        statusMessage:
          type: string
          description: Required when status is deprecated or deleted; must be absent when active.

    SetVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [public, private]

    # ── Audit ───────────────────────────────────────────────────────────────

    AuditEvent:
      type: object
      required: [id, actor_subject, actor_email, action, resource_type, resource_id, created_at]
      properties:
        id:
          type: string
          description: ULID
        actor_subject:
          type: string
          description: Keycloak subject UUID
        actor_email:
          type: string
        action:
          type: string
          description: Action performed (e.g. mcp_server.created)
        resource_type:
          type: string
        resource_id:
          type: string
        resource_ns:
          type: string
        resource_slug:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type: string

    PublicActivityEvent:
      type: object
      description: >
        A privacy-scrubbed view of an audit event suitable for public
        consumption. Actor identity (email, subject) is NEVER exposed;
        only a coarse `actor_role` label is returned.
      required: [id, action, actor_role, created_at]
      properties:
        id:
          type: string
          description: ULID of the underlying audit event
        action:
          type: string
          description: Normalized action key (e.g. mcp_server_version.published)
        actor_role:
          type: string
          enum: [publisher, admin]
          description: >
            Coarse label. "publisher" when the actor is acting on a
            resource in their own publisher namespace; "admin" otherwise.
        version:
          type: string
          description: Semantic version, when the event relates to a specific version
        metadata:
          type: object
          description: >
            Scrubbed metadata. Only a whitelisted subset of keys is ever
            included (e.g. `from`, `to`, `visibility`, `reason`). Any key
            not on the whitelist is dropped server-side.
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    PublicActivityEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicActivityEvent"
        next_cursor:
          type: string

    PublisherActivityEvent:
      type: object
      description: >
        One entry in a publisher's members-only activity feed. Names the actor
        (the publisher's own collaborators), unlike the public per-resource feed.
      required: [id, action, resource_type, resource_slug, created_at]
      properties:
        id:
          type: string
          description: ULID of the underlying audit event
        action:
          type: string
          description: Normalized action key (e.g. mcp_server_version.published)
        resource_type:
          type: string
          description: Either mcp_server or agent
        resource_slug:
          type: string
          description: Slug of the affected entry within the publisher
        version:
          type: string
          description: Semantic version, when the event relates to a specific version
        actor_email:
          type: string
          description: Email of the actor who performed the action, when known
        metadata:
          type: object
          description: >
            Scrubbed metadata. Only a whitelisted subset of keys is included
            (e.g. `from`, `to`, `visibility`, `reason`, `version`, `field`).
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    PublisherActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublisherActivityEvent"
        next_cursor:
          type: string

    ChangelogEntry:
      type: object
      required: [resource_type, namespace, slug, name, version, published_at]
      properties:
        resource_type:
          type: string
          enum: [mcp_server, agent]
        namespace:
          type: string
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        published_at:
          type: string
          format: date-time

    ChangelogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntry"

    Report:
      type: object
      required: [id, resource_type, resource_id, issue_type, description, status, created_at]
      properties:
        id:
          type: string
          description: ULID
        resource_type:
          type: string
          enum: [mcp_server, agent]
        resource_id:
          type: string
          description: ULID of the reported resource
        issue_type:
          type: string
          enum: [broken, misleading, spam, security, licensing, outdated, duplicate, other]
        description:
          type: string
          minLength: 5
          maxLength: 4000
        status:
          type: string
          enum: [pending, reviewed, dismissed]
        reporter_ip:
          type: string
          description: Admin-only — only present in list responses for authenticated admins
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          description: Admin-only — subject UUID of the reviewer

    ReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"

    CreateReportRequest:
      type: object
      required: [resource_type, resource_id, issue_type, description]
      properties:
        resource_type:
          type: string
          enum: [mcp_server, agent]
        resource_id:
          type: string
        issue_type:
          type: string
          enum: [broken, misleading, spam, security, licensing, outdated, duplicate, other]
        description:
          type: string
          minLength: 5
          maxLength: 4000

    UpdateReportStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, reviewed, dismissed]

    # ── v0 wire format ──────────────────────────────────────────────────────

    V0Repository:
      type: object
      required: [url]
      properties:
        url:
          type: string
        source:
          type: string
          description: e.g. "github", "gitlab"
        subfolder:
          type: string
        id:
          type: string

    V0ServerDetail:
      type: object
      required: [name, description]
      properties:
        id:
          type: string
          description: ULID of the registry entry
        name:
          type: string
          description: "namespace/slug (e.g. acme/my-server)"
        description:
          type: string
        title:
          type: string
        version:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageEntry"
        capabilities:
          type: object
          additionalProperties: true
        repository:
          $ref: "#/components/schemas/V0Repository"
        websiteUrl:
          type: string

    V0OfficialMeta:
      type: object
      properties:
        status:
          type: string
          enum: [active, deprecated, deleted, draft]
        statusMessage:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statusChangedAt:
          type: string
          format: date-time
        isLatest:
          type: boolean

    V0ServerResponse:
      type: object
      required: [server, _meta]
      properties:
        server:
          $ref: "#/components/schemas/V0ServerDetail"
        _meta:
          type: object
          properties:
            io.modelcontextprotocol.registry/official:
              $ref: "#/components/schemas/V0OfficialMeta"

    V0ListMetadata:
      type: object
      required: [count]
      properties:
        count:
          type: integer
        nextCursor:
          type: string

    V0ListResponse:
      type: object
      required: [servers, metadata]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/V0ServerResponse"
        metadata:
          $ref: "#/components/schemas/V0ListMetadata"

    V0StatusPatchRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, deprecated, deleted]
        statusMessage:
          type: string

    V0AllVersionsStatusResponse:
      type: object
      required: [updatedCount, servers]
      properties:
        updatedCount:
          type: integer
        servers:
          type: array
          items:
            $ref: "#/components/schemas/V0ServerResponse"

    V0PublishRequest:
      type: object
      required: [name, description, version, protocolVersion]
      properties:
        name:
          type: string
          description: "namespace/slug (e.g. acme/my-server)"
          pattern: "^[a-zA-Z0-9.-]+/[a-zA-Z0-9._-]+$"
        description:
          type: string
        version:
          type: string
        title:
          type: string
        protocolVersion:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageEntry"
        capabilities:
          type: object
          additionalProperties: true
        repository:
          $ref: "#/components/schemas/V0Repository"
        websiteUrl:
          type: string

    V0Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Error (RFC 7807) ────────────────────────────────────────────────────

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but lacks required scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Duplicate slug or version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Request body failed schema validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
