services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    # In 18+ the official image stores data in a major-version-specific
    # subdirectory under /var/lib/postgresql, so the volume must mount the
    # parent. Mounting /var/lib/postgresql/data directly causes the
    # "unused mount/volume" startup error documented in
    # https://github.com/docker-library/postgres/pull/1259.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak (dev mode, built-in H2 DB) ────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm-dev.json:/opt/keycloak/data/import/ai-registry-realm.json:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      # Keycloak 23+ exposes health on the management port (9000), not 8080.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/ai-registry || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Server ───────────────────────────────────────────────────────────────────
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Dev defaults — Keycloak is exposed on localhost:8080 from the host,
      # but the server container reaches it via the internal Docker network.
      # OIDC_ISSUER is the public-facing URL (matches the `iss` claim in tokens).
      # OIDC_JWKS_URL lets the server fetch JWKS internally without going via the host.
      # Override any of these in .env to customise for your environment.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/ai-registry}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/ai-registry/protocol/openid-connect/certs}
      # OIDC (ADR 0006 amendment) is brokered server-side with a single
      # CONFIDENTIAL client; it is enabled only when BOTH OIDC_CLIENT_ID and
      # OIDC_CLIENT_SECRET are set. OFF by default — local login (below) is the
      # out-of-the-box front door. To enable OIDC, point OIDC_CLIENT_ID at a
      # confidential Keycloak client (standard flow + the callback redirect URI
      # registered), set OIDC_CLIENT_SECRET, and ensure OIDC_ISSUER is reachable
      # from the server container (discovery is fetched server-side).
      # RBAC + change-approval auth knobs (see ADR 0006).
      # Defaults match the server's built-in fallbacks; override in .env
      # when binding to a non-default IdP claim or reviewer group.
      AUTH_GROUPS_CLAIM: ${AUTH_GROUPS_CLAIM:-groups}
      AUTH_REVIEWER_GROUP: ${AUTH_REVIEWER_GROUP:-registry-reviewers}
      # Local email+password login (ADR 0006) — the out-of-the-box front door.
      # ON by default so the bundled stack is usable with no IdP. Logging in
      # needs an account: the bootstrap admin below is seeded on first boot.
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      # Bootstrap Server Admin seeded on first boot (create-only). These are
      # QUICKSTART credentials — CHANGE them via .env for any real deployment.
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-devadmin12345}
      # Session cookie is Secure by default; this localhost quickstart is plain
      # HTTP, so default it off (or the browser drops the cookie and login
      # silently fails). Set AUTH_SESSION_SECURE=true behind real HTTPS.
      AUTH_SESSION_SECURE: ${AUTH_SESSION_SECURE:-false}
      AUTH_SESSION_SAMESITE: ${AUTH_SESSION_SAMESITE:-lax}
      DATABASE_URL: ${DATABASE_URL:-postgres://registry:registry@postgres:5432/registry?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Public-facing base URL of the stack. Required — the A2A global agent
      # card handler returns HTTP 500 when unset rather than silently
      # advertising a localhost URL to external consumers. Defaults to the
      # nginx port mapping below so `docker compose up` and CI both work
      # out of the box; override in .env for non-localhost deployments.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # No healthcheck: the distroless runtime image has no shell or wget.
    # Use `docker inspect` or check http://localhost:8081/readyz from the host.

  # ── Web (Vite SPA served by nginx) ──────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      # nginx proxies /api/, /config.json, etc. to this upstream.
      API_URL: "http://server:8081"
    ports:
      - "3000:8080"
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_healthy

  # ── OTel Collector (observability profile) ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    profiles: [observability]
    restart: unless-stopped
    command: --config /etc/otel/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # ── Jaeger (observability profile) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.65
    profiles: [observability]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4319:4317"    # OTLP gRPC (offset to avoid conflict with collector)

volumes:
  postgres_data:
