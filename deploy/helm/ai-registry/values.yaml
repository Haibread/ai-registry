# Default values for ai-registry.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ----------------------------------------------------------------------------
# Backend (Go HTTP service)
# ----------------------------------------------------------------------------
server:
  replicaCount: 1

  image:
    repository: ghcr.io/haibread/ai-registry/server
    # Defaults to .Chart.AppVersion when empty
    tag: ""

  # ── Auth (OIDC, brokered server-side) ───────────────────────────────────
  # OIDC is brokered server-side: the registry is a single CONFIDENTIAL client
  # that runs Authorization Code + PKCE and issues its own session cookie. The
  # SPA is NOT an OIDC client.
  #
  # Master switch. Leave false to run local-login-only (see localLogin below) —
  # no IdP required. Set true to add the OIDC front door; the chart then
  # requires oidcIssuer, oidcClientId, and a client-secret source, failing the
  # render if any is missing rather than letting the pod crash-loop on boot.
  # At least one of oidcEnabled / localLogin.enabled must be true.
  oidcEnabled: false
  # [REQUIRED when oidcEnabled] OIDC issuer URL — the BROWSER-facing issuer;
  # must match the `iss` claim in issued tokens.
  oidcIssuer: ""
  # Base URL (scheme://host) the server uses to reach the IdP for back-channel
  # calls (discovery / token exchange / JWKS) when the public issuer is not
  # reachable from inside the cluster. Empty = use oidcIssuer for everything.
  # Example: http://keycloak.identity.svc:8080/realms/ai-registry
  oidcInternalUrl: ""
  # Override the JWKS fetch URL for internal network resolution (e.g. when the
  # server pod cannot reach the public issuer URL directly). Usually unset when
  # oidcInternalUrl is provided.
  # Example: http://keycloak:8080/realms/ai-registry/protocol/openid-connect/certs
  oidcJwksUrl: ""
  # [REQUIRED when oidcEnabled] Confidential broker client ID. This is the
  # SERVER's OAuth client — it is NOT served to the browser.
  # Example: ai-registry-server
  oidcClientId: ""
  # [REQUIRED when oidcEnabled] Confidential broker client secret. Provide exactly
  # one source (existingSecret wins): an inline value (DEV/quickstart only —
  # rendered into a Kubernetes
  # Secret, base64 NOT encrypted), or the name of a pre-existing Secret holding
  # the key OIDC_CLIENT_SECRET. In production prefer existingSecret with
  # external-secrets / sealed-secrets.
  oidcClientSecret: ""
  oidcClientSecretExistingSecret: ""
  # Callback URL the IdP redirects to after login. Empty = derived from
  # publicBaseURL + /api/v1/auth/oidc/callback. Override only when the IdP must
  # redirect to a different host than publicBaseURL.
  oidcRedirectUrl: ""
  # OAuth scopes requested at the authorize endpoint. Empty = server default
  # (openid, profile, email). List form, e.g. ["openid", "profile", "groups"].
  oidcScopes: []
  # JWT claim path for the user's group memberships. Group membership
  # resolves to publisher-scoped role grants for authorization. Empty =
  # server default ("groups"). Set this to the path your IdP emits (e.g.
  # "realm_access.groups" for Keycloak realm-mapper deployments).
  authGroupsClaim: ""
  # Reviewer group whose members can approve / reject pending changes
  # in the change-approval workflow. Empty = server default
  # ("registry-reviewers"). Must match a group emitted in the JWT
  # claim configured above.
  authReviewerGroup: ""

  # ── Auth (local accounts) ────────────────────────────────────────
  # Local email + password login, ending in the same registry session cookie as
  # OIDC. Enabled by default so a stock `helm install` is a working local-login
  # registry with no external IdP (decision N). Set false to run OIDC-only — but
  # then oidcEnabled must be true, or the chart fails the render (no login
  # method). Seed an initial account via bootstrapAdmin below.
  localLogin:
    enabled: true
    # Bootstrap Server Admin seeded on startup when local login is enabled.
    # Idempotent: the account is upserted on each boot, never duplicated.
    bootstrapAdmin:
      # Login email for the bootstrap admin. Empty = no admin seeded.
      email: ""
      # Inline password (DEV/quickstart only) — rendered into a Kubernetes
      # Secret (base64, NOT encrypted). Ignored when existingSecret is set.
      # In production prefer existingSecret with external-secrets / sealed-secrets.
      password: ""
      # Name of a pre-existing Secret holding key AUTH_BOOTSTRAP_ADMIN_PASSWORD.
      # Takes precedence over the inline password above.
      existingSecret: ""

  # ── Database ─────────────────────────────────────────────────────────────
  # DATABASE_URL — provide exactly one of the following (highest wins):
  #   databaseUrlSecret : name of a pre-existing Kubernetes Secret whose key
  #                       "DATABASE_URL" holds the connection string (recommended)
  #   databaseUrl       : plain-text value (not recommended for production)
  #   cnpg.enabled      : use the CNPG-managed cluster (see cnpg section)
  databaseUrl: ""
  databaseUrlSecret: ""
  # Connection pool sizes.
  dbMaxConns: 25
  dbMinConns: 5

  # ── HTTP ─────────────────────────────────────────────────────────────────
  # Comma-separated list of allowed CORS origins.
  # Example: "https://registry.example.com,https://admin.example.com"
  corsAllowedOrigins: ""
  # CIDR of the trusted reverse proxy for real-IP extraction via X-Forwarded-For.
  # Example: "10.0.0.0/8"
  trustedProxyCIDR: ""
  # [REQUIRED] Public-facing base URL of the deployment. Used by the A2A
  # global agent card and OAuth protected-resource metadata. Must be the
  # externally reachable URL (what clients use), not an in-cluster address.
  # Example: "https://registry.example.com"
  publicBaseURL: ""

  # ── Observability ────────────────────────────────────────────────────────
  # Structured log level: debug | info | warn | error
  logLevel: "info"
  # OTLP gRPC endpoint for traces/metrics export (leave empty to disable).
  # Example: http://otel-collector:4317
  otlpEndpoint: ""

  # ── Bootstrap ────────────────────────────────────────────────────────────
  # When enabled, the server loads a bootstrap file on startup and upserts
  # all publishers, MCP servers, and agents. Idempotent — safe to re-run.
  bootstrap:
    enabled: false
    # sampleData: load the built-in sample data bundled with the chart
    # (publishers + MCP servers + agents). Ignored when content is set.
    sampleData: false
    # content: inline YAML bootstrap file. Takes precedence over sampleData.
    # Paste the full contents of a bootstrap.yaml here.
    content: ""
    # Directory where the bootstrap ConfigMap is mounted inside the container.
    # The server reads <mountPath>/bootstrap.yaml (set via BOOTSTRAP_FILE env var).
    mountPath: /etc/ai-registry

  service:
    type: ClusterIP
    port: 8080

  # Conservative defaults sized for the registry workload: almost idle at
  # rest, bursty under admin writes / migrations. Override before going to
  # production with real traffic data. Requests must be set (not {}) so the
  # HPA can compute target utilisation and the scheduler can bin-pack.
  # Deliberately no CPU limit — CPU throttling under CFS quota degrades
  # latency worse than the oversubscription it prevents. Memory IS limited
  # so a leak can't take down the node.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  podAnnotations: {}
  podLabels: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532  # nonroot user in gcr.io/distroless/static-debian12:nonroot
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # ── Probes ───────────────────────────────────────────────────────────────
  # Full probe objects — override any field including httpGet.path/port,
  # initialDelaySeconds, periodSeconds, timeoutSeconds, failureThreshold, etc.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    # 12 × 5 s = 60 s maximum startup budget before liveness kicks in.
    failureThreshold: 12

  # ── Volume mount paths ───────────────────────────────────────────────────
  # Writable /tmp directory for the read-only-root-filesystem container.
  tmpDir: /tmp

  # ── Autoscaling ──────────────────────────────────────────────────────────
  # When enabled, an HPA manages the replica count; replicaCount is ignored.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80

  # PDB is only rendered when enabled=true AND (replicaCount > 1 OR autoscaling
  # is enabled). With a single replica, a minAvailable=1 PDB blocks node drains
  # indefinitely — see https://kubernetes.io/docs/tasks/run-application/configure-pdb/.
  # Bump replicaCount or enable autoscaling before enabling this in production.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # Override the name (defaults to fullname-backend)
    name: ""

  # ── Prometheus ServiceMonitor ────────────────────────────────────────────
  # Opt-in resource for the Prometheus Operator. Leave disabled unless the
  # operator (and its CRDs) is installed in the target cluster.
  serviceMonitor:
    enabled: false
    # namespace: ""          # Defaults to the release namespace.
    # path: /metrics
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}   # e.g. { release: kube-prometheus-stack }
    # relabelings: []
    # metricRelabelings: []

  # ── Escape hatches ───────────────────────────────────────────────────────
  # Extra environment variables injected into the server container.
  extraEnv: []
  # Example:
  # extraEnv:
  #   - name: MY_FEATURE_FLAG
  #     value: "true"
  #   - name: SECRET_FROM_K8S
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: my-key

  # Extra volumes and mounts (e.g. for custom TLS certs or config files).
  extraVolumes: []
  extraVolumeMounts: []

# ----------------------------------------------------------------------------
# Web (Vite + React SPA served by nginx)
# ----------------------------------------------------------------------------
web:
  replicaCount: 1

  image:
    repository: ghcr.io/haibread/ai-registry/web
    # Defaults to .Chart.AppVersion when empty
    tag: ""

  # Non-sensitive environment variables
  # Internal URL for the SPA's API proxy (server-side only).
  # Falls back to the in-cluster backend service URL when empty.
  apiUrl: ""

  service:
    type: ClusterIP
    port: 8080  # nginx-unprivileged listens on 8080 (non-root cannot bind < 1024)

  # nginx serving static SPA assets + proxying a few endpoints — tiny footprint.
  # See server.resources for why CPU limits are intentionally omitted.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  podLabels: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101   # nginx user in nginxinc/nginx-unprivileged
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    # /var/cache/nginx, /var/run, and /etc/nginx/conf.d are mounted as emptyDir
    # so nginx can write to them; the root filesystem is otherwise read-only.
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # ── Probes ───────────────────────────────────────────────────────────────
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # ── Volume mount paths ───────────────────────────────────────────────────
  # Writable /tmp directory (used by nginx for temp files and the envsubst config).
  tmpDir: /tmp

  # ── Autoscaling ──────────────────────────────────────────────────────────
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80

  # See note on server.podDisruptionBudget above.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # ── Escape hatches ───────────────────────────────────────────────────────
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ----------------------------------------------------------------------------
# Ingress (nginx / classic)
# ----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  # Example annotations for cert-manager + nginx:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: ai-registry.example.com
  tls:
    enabled: false
    secretName: ""

# ----------------------------------------------------------------------------
# Gateway API HTTPRoute
# An alternative to the Ingress resource for clusters running a Gateway API
# controller (Envoy Gateway, Cilium, Istio, Traefik v3, …).
#
# TLS is configured on the Gateway listener — not here. If your Gateway
# listener already terminates TLS for the hostname, the SPA and API will be
# served over HTTPS automatically without any change to this section.
#
# Both httpRoute and ingress can be enabled at the same time (e.g. during a
# migration), but enabling both for the same host with different controllers
# may cause conflicts. Enable only one per production environment.
# ----------------------------------------------------------------------------
httpRoute:
  enabled: false

  # [REQUIRED when enabled] Reference to the Gateway this route attaches to.
  gatewayRef:
    name: ""          # Name of the Gateway resource
    namespace: ""     # Namespace of the Gateway (empty = same namespace as this release)
    sectionName: ""   # Optional: specific listener section (e.g. "https")

  # Hostname the route matches. Should align with the Gateway listener's hostname.
  host: ai-registry.example.com

  annotations: {}

# ----------------------------------------------------------------------------
# CloudNativePG (CNPG) managed Postgres cluster
# Set cnpg.enabled=true to provision a Postgres cluster inside the namespace.
# Requires the CNPG operator to be installed in the cluster.
# ----------------------------------------------------------------------------
cnpg:
  enabled: false
  instances: 1
  storageSize: 5Gi
  # Major version of the CNPG postgres image. Bumped to "18" to match the
  # docker-compose stack (postgres:18-alpine, see PR #41); CNPG publishes
  # ghcr.io/cloudnative-pg/postgresql:18 images.
  postgresVersion: "18"

  # Database and owner created by the initdb bootstrap.
  initdb:
    database: ai_registry
    owner: ai_registry

  # PostgreSQL server parameters (free-form map — add any GUC you need).
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"

  # Allow the CNPG operator to connect as the superuser (needed for migrations).
  # CNPG auto-creates "<clusterName>-superuser" which the backend deployment
  # references to build DATABASE_URL.
  enableSuperuserAccess: true
