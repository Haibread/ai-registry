apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-registry.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-registry.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force a rollout when the ConfigMap or Secret changes.
        checksum/configmap: {{ include (print $.Template.BasePath "/server/configmap.yaml") . | sha256sum }}
        {{- if and .Values.server.databaseUrl (not .Values.server.databaseUrlSecret) (not .Values.cnpg.enabled) }}
        checksum/secret: {{ include (print $.Template.BasePath "/server/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.server.bootstrap.enabled }}
        checksum/bootstrap: {{ include (print $.Template.BasePath "/server/bootstrap-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.server.localLogin.enabled .Values.server.localLogin.bootstrapAdmin.password (not .Values.server.localLogin.bootstrapAdmin.existingSecret) }}
        checksum/local-login-secret: {{ include (print $.Template.BasePath "/server/local-login-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.server.oidcEnabled .Values.server.oidcClientSecret (not .Values.server.oidcClientSecretExistingSecret) }}
        checksum/oidc-secret: {{ include (print $.Template.BasePath "/server/oidc-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if or (and .Values.server.jwtSigningKey (not .Values.server.jwtSigningKeyExistingSecret)) (and .Values.server.jwtSigningSeed (not .Values.server.jwtSigningSeedExistingSecret)) }}
        checksum/jwt-secret: {{ include (print $.Template.BasePath "/server/jwt-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ai-registry.server.selectorLabels" . | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-registry.server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          image: {{ include "ai-registry.server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ai-registry.server.fullname" . }}
          env:
            {{- /*
              DATABASE_URL precedence (highest to lowest):
              1. External secret referenced by databaseUrlSecret
              2. CNPG-generated superuser secret (when cnpg.enabled)
              3. Plain-text value injected via ConfigMap (lowest)
            */}}
            {{- if .Values.server.databaseUrlSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.databaseUrlSecret }}
                  key: DATABASE_URL
            {{- else if .Values.cnpg.enabled }}
            # CNPG's superuser secret.uri hardcodes dbname=*; rebuild the DSN
            # so it targets the initdb database instead.
            - name: _PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-registry.cnpg.superuserSecretName" . }}
                  key: username
            - name: _PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-registry.cnpg.superuserSecretName" . }}
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(_PG_USER):$(_PG_PASSWORD)@{{ include "ai-registry.cnpg.clusterName" . }}-rw.{{ .Release.Namespace }}.svc:5432/{{ .Values.cnpg.initdb.database }}?sslmode=require"
            {{- else if .Values.server.databaseUrl }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-registry.server.fullname" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- /*
              Local bootstrap-admin password: from the operator's
              existingSecret when set, else the chart-rendered Secret. Omitted
              entirely when local login is off or no password source is given.
            */}}
            {{- if and .Values.server.localLogin.enabled (or .Values.server.localLogin.bootstrapAdmin.password .Values.server.localLogin.bootstrapAdmin.existingSecret) }}
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.localLogin.bootstrapAdmin.existingSecret | default (printf "%s-bootstrap-admin" (include "ai-registry.server.fullname" .)) }}
                  key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
            {{- end }}
            {{- /*
              Confidential OIDC broker client secret: from the operator's
              existingSecret when set, else the chart-rendered Secret. Only wired
              when OIDC is enabled; local-login-only deployments omit it.
            */}}
            {{- if and .Values.server.oidcEnabled (or .Values.server.oidcClientSecret .Values.server.oidcClientSecretExistingSecret) }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.oidcClientSecretExistingSecret | default (printf "%s-oidc" (include "ai-registry.server.fullname" .)) }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}
            {{- /*
              Ed25519 access-token signing key: from the operator's existingSecret
              when set, else the chart-rendered Secret. Optional — when neither is
              provided the server generates an EPHEMERAL key at boot, which breaks
              multi-replica verification and does not survive a restart. Set it for
              any real deployment.
            */}}
            {{- if or .Values.server.jwtSigningKey .Values.server.jwtSigningKeyExistingSecret }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.jwtSigningKeyExistingSecret | default (printf "%s-jwt" (include "ai-registry.server.fullname" .)) }}
                  key: JWT_SIGNING_KEY
            {{- end }}
            {{- /* Alternative to the PEM key: derive the key from a secret seed
              string (the server prefers JWT_SIGNING_KEY when both are set). */}}
            {{- if or .Values.server.jwtSigningSeed .Values.server.jwtSigningSeedExistingSecret }}
            - name: JWT_SIGNING_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.jwtSigningSeedExistingSecret | default (printf "%s-jwt" (include "ai-registry.server.fullname" .)) }}
                  key: JWT_SIGNING_SEED
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.server.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.server.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.server.startupProbe | nindent 12 }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: {{ .Values.server.tmpDir }}
            {{- if .Values.server.bootstrap.enabled }}
            - name: bootstrap
              mountPath: {{ .Values.server.bootstrap.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.server.bootstrap.enabled }}
        - name: bootstrap
          configMap:
            name: {{ include "ai-registry.server.fullname" . }}-bootstrap
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
