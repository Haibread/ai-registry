{{- /*
Bootstrap Server Admin password Secret — rendered only when local login is
enabled with an inline password and no external existingSecret. When
existingSecret is set the operator owns the Secret (it must carry the key
AUTH_BOOTSTRAP_ADMIN_PASSWORD) and this template produces nothing. base64 in a
Secret is encoding, not encryption — prefer existingSecret with
external-secrets / sealed-secrets in production.
*/}}
{{- if and .Values.server.localLogin.enabled .Values.server.localLogin.bootstrapAdmin.password (not .Values.server.localLogin.bootstrapAdmin.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-registry.server.fullname" . }}-bootstrap-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.server.localLogin.bootstrapAdmin.password | quote }}
{{- end }}
