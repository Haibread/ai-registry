{{- if .Values.ingress.enabled -}}
{{- /*
Two routes only:
  * /api → server, so the bulk API traffic reaches the backend directly.
  * /    → web, where nginx serves the SPA AND proxies the remaining backend
           paths (/.well-known/, the A2A agent card, /docs, /openapi.yaml,
           /config.json, /healthz, /readyz, /metrics). Keeping that long tail in
           nginx.conf avoids a second, drift-prone copy of the routing table here
           — and avoids routing SPA routes such as /agents/{ns}/{slug} to the
           backend. The nginx-ingress controller matches the longest prefix, so
           /api wins over / for /api/* regardless of rule order.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "ai-registry.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API straight to the server (bulk traffic skips the nginx hop).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-registry.api.fullname" . }}
                port:
                  number: {{ .Values.api.service.port }}
          # Everything else to nginx: SPA + the remaining proxied backend paths.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-registry.webapp.fullname" . }}
                port:
                  number: {{ .Values.webapp.service.port }}
{{- end }}
