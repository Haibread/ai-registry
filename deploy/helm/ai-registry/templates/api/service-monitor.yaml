{{- if .Values.api.serviceMonitor.enabled -}}
# Prometheus Operator ServiceMonitor.
# Rendered only when serviceMonitor.enabled=true. Requires the CRD from the
# kube-prometheus-stack / Prometheus Operator to be installed in-cluster.
# Users without the operator should scrape via pod annotations or leave this
# disabled.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-registry.api.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.api.serviceMonitor.namespace }}
  labels:
    {{- include "ai-registry.api.labels" . | nindent 4 }}
    {{- with .Values.api.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "ai-registry.api.selectorLabels" . | nindent 6 }}
  endpoints:
    # /metrics is unauthenticated and served only on the api ClusterIP Service;
    # the Ingress/HTTPRoute send it to nginx, which answers 404. Set
    # global.networkPolicy.enabled to restrict pod-to-pod scraping to
    # api.networkPolicy.metricsScraperPeers.
    - port: http
      path: {{ .Values.api.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.api.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.api.serviceMonitor.scrapeTimeout | default "10s" }}
      {{- with .Values.api.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
