{{- /*
Access-token signing material. Renders the chart-owned Secret holding whichever
inline value(s) the operator set — JWT_SIGNING_KEY (PEM PKCS#8 Ed25519) and/or
JWT_SIGNING_SEED (a high-entropy secret string the key is derived from). The
server prefers the PEM key when both are present. Each source is omitted here
when its *ExistingSecret is set (the operator owns that Secret, carrying the
matching key). base64 in a Secret is encoding, not encryption — prefer an
existingSecret with external-secrets / sealed-secrets in production. When no
source is provided the server generates an ephemeral key at boot (dev only).
*/}}
{{- $inlineKey := and .Values.api.jwtSigningKey (not .Values.api.jwtSigningKeyExistingSecret) }}
{{- $inlineSeed := and .Values.api.jwtSigningSeed (not .Values.api.jwtSigningSeedExistingSecret) }}
{{- if or $inlineKey $inlineSeed -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-registry.api.fullname" . }}-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $inlineKey }}
  JWT_SIGNING_KEY: {{ .Values.api.jwtSigningKey | quote }}
  {{- end }}
  {{- if $inlineSeed }}
  JWT_SIGNING_SEED: {{ .Values.api.jwtSigningSeed | quote }}
  {{- end }}
{{- end }}
