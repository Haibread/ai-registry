{{- /*
Confidential OIDC broker client secret — rendered only when OIDC is enabled with
an inline oidcClientSecret and no external existingSecret. When
oidcClientSecretExistingSecret is set the operator owns the Secret (it must
carry the key OIDC_CLIENT_SECRET) and this template produces nothing. base64 in
a Secret is encoding, not encryption — prefer an existingSecret with
external-secrets / sealed-secrets in production. Validation (mutual exclusion,
required-when-enabled) lives in the ai-registry.api.validateAuth helper.
*/}}
{{- if and .Values.api.oidcEnabled .Values.api.oidcClientSecret (not .Values.api.oidcClientSecretExistingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-registry.api.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ .Values.api.oidcClientSecret | quote }}
{{- end }}
