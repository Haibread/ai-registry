{{- /*
This secret is rendered only when the user provides a plain-text database.url
directly in values (i.e., not using an external pre-existing secret or CNPG).
When database.existingSecret is set, users are expected to create that secret
themselves; this template produces nothing.
*/}}
{{- if and .Values.api.database.url (not .Values.api.database.existingSecret) (not .Values.cnpg.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-registry.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-registry.api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.api.database.url | quote }}
{{- end }}
