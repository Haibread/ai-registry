# ============================================================================
# AI Registry — YAML config file example
# ============================================================================
# Copy to config.yaml and adjust values.  Pass the path via --config or set
# CONFIG_FILE=/path/to/config.yaml.
#
# Environment variables always take precedence over values in this file.
# Missing keys fall back to built-in defaults (shown below).
# ============================================================================

http:
  # Address and port the HTTP server listens on.
  addr: ":8081"
  # Connection timeouts (Go duration strings).
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  # Allowed CORS origins.
  cors_origins: []
  #  - "http://localhost:3000"
  #  - "https://registry.example.com"
  # CIDR of the trusted reverse proxy (empty = no proxy).
  trusted_proxy_cidr: ""
  # Per-IP request budget for unauthenticated reads on /api/v1, in
  # requests per minute.
  public_rate_limit_rpm: 1000
  # Externally reachable URL of this deployment. Surfaced in
  # /.well-known/oauth-protected-resource and the global A2A agent card.
  # Empty triggers HTTP 500 in those handlers rather than advertising
  # localhost to external consumers. Example: "https://registry.example.com".
  public_base_url: ""

database:
  # [REQUIRED] PostgreSQL DSN.
  url: "postgres://user:password@host:5432/ai_registry?sslmode=disable"
  max_conns: 25
  min_conns: 5

otel:
  service_name: "ai-registry-server"
  service_version: "0.1.0"
  # OTLP gRPC endpoint.  Empty = Prometheus /metrics only.
  otlp_endpoint: ""

log:
  # debug | info | warn | error
  level: "info"

# Optional bootstrap data file. Path to a YAML/JSON document of publishers,
# MCP servers and agents that the server upserts on startup
# before accepting traffic. The `--bootstrap-file` CLI flag overrides
# this YAML key and the BOOTSTRAP_FILE env var.
bootstrap_file: ""

auth:
  # [REQUIRED] OIDC issuer URL (must match `iss` claim in JWTs).
  oidc_issuer: ""
  # Override JWKS fetch URL (useful inside Docker where the public URL is
  # unreachable from the server container).
  oidc_jwks_url: ""
  # Base URL the server uses to reach the IdP back-channel (discovery / token /
  # JWKS) when the public oidc_issuer is unreachable from inside the network
  # (e.g. Keycloak in Docker). The browser-facing authorize URL keeps the issuer
  # host, so the IdP must advertise oidc_issuer (pin its hostname). Empty = use
  # oidc_issuer for everything. Example: http://keycloak:8080/realms/ai-registry
  oidc_internal_url: ""
  # Confidential OAuth 2.0 client ID for the SERVER-SIDE OIDC broker.
  # The SPA is no longer an OIDC client — this value is never sent
  # to the browser. OIDC login is enabled only when this AND the secret are set;
  # the secret is a credential (env OIDC_CLIENT_SECRET only, never this file).
  oidc_client_id: ""
  # Override the IdP redirect/callback URL. Empty derives it from
  # public_base_url + /api/v1/auth/oidc/callback.
  oidc_redirect_url: ""
  # JWT claim path for the user's group memberships. Group membership
  # resolves to publisher-scoped role grants for authorization. Defaults to
  # "groups"; set to e.g. "realm_access.groups" if your IdP nests group
  # memberships under a different key.
  groups_claim: "groups"
  # Group seeded on boot with a global Reviewer grant. Members
  # (local group_members or a matching OIDC claim group) can approve/reject
  # pending changes on any publisher. Deprecated in favour of managing the
  # group + grant via the API.
  reviewer_group: "registry-reviewers"
  # OIDC id_token claim paths the broker maps groups + roles from, at login.
  oidc_roles_claim: "realm_access.roles"
  oidc_admin_role: "admin"
  # Local email+password login. Default true so the registry is usable without an
  # IdP. Both front doors mint a registry-issued token pair (no cookie). The
  # bootstrap admin PASSWORD is a credential and is intentionally NOT settable
  # here — supply it via AUTH_BOOTSTRAP_ADMIN_PASSWORD (env / secret only).
  local_login: true
  # Email of the bootstrap Server Admin seeded on first boot. The email is not
  # a secret; the matching AUTH_BOOTSTRAP_ADMIN_PASSWORD must be set via env.
  # Leave empty to skip bootstrap seeding.
  bootstrap_admin_email: ""
  # Registry-issued bearer tokens. Both front doors mint a short access token and
  # a rotating refresh token. The Ed25519 signing key (JWT_SIGNING_KEY) is a
  # credential and is intentionally NOT settable here — supply it via env / secret.
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
