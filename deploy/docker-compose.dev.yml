name: ai-registry-dev

# Development stack — Vite dev server with hot reload.
#
# Usage (from the deploy/ directory):
#   docker compose -f docker-compose.dev.yml up -d
#
# The web service mounts ../web directly into the container and runs
# `vite dev`, so any file save is picked up immediately.
# Vite proxies /api/* and /config.json to the server (configured in vite.config.ts).
# All other services are identical to the production compose.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    # See docker-compose.yml — pg18 mounts the parent of the data dir.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the front-channel hostname so the issuer + authorize URL are stably
      # http://localhost:8080 no matter how Keycloak is reached. The registry
      # broker fetches discovery/token/JWKS over the internal keycloak:8080 host
      # (OIDC_INTERNAL_URL) while the browser uses localhost:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak-realm-dev.json:/opt/keycloak/data/import/ai-registry-realm.json:ro
    ports:
      - "8080:8080"

  # ── Server ───────────────────────────────────────────────────────────────────
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Dev defaults — override any of these in .env for your environment.
      # OIDC is brokered server-side with a single
      # CONFIDENTIAL client; it is enabled because BOTH OIDC_CLIENT_ID and
      # OIDC_CLIENT_SECRET are set below (the `ai-registry-server` broker client
      # from keycloak-realm-dev.json). The browser hits Keycloak at
      # localhost:8080 (front-channel); the server reaches it at keycloak:8080
      # for discovery/token/JWKS via OIDC_INTERNAL_URL. KC_HOSTNAME (above) pins
      # the issuer so the two views agree. Set OIDC_CLIENT_SECRET="" to disable.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/ai-registry}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://keycloak:8080/realms/ai-registry}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ai-registry-server}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-broker-secret}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/ai-registry/protocol/openid-connect/certs}
      # RBAC + change-approval auth knobs. Defaults match the
      # server's built-in fallbacks, so the keys only need to be set
      # in .env when overriding for a custom IdP setup.
      AUTH_GROUPS_CLAIM: ${AUTH_GROUPS_CLAIM:-groups}
      AUTH_REVIEWER_GROUP: ${AUTH_REVIEWER_GROUP:-registry-reviewers}
      # Local email+password login — the dev front door. ON by
      # default so the stack is usable with no IdP. Logging in needs an account:
      # the bootstrap admin below is seeded on first boot.
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      # Bootstrap Server Admin seeded on first boot (create-only — never
      # overwrites an existing account). These are DEV credentials; rotate /
      # override in .env for any shared environment.
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-devadmin12345}
      # Auth is a bearer token (no cookie). No signing key is set here, so the
      # server generates an ephemeral key at boot — fine for dev. In prod set
      # JWT_SIGNING_KEY (PEM) or JWT_SIGNING_SEED (secret string, >= 32 chars).
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_SEED: ${JWT_SIGNING_SEED:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://registry:registry@postgres:5432/registry?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Public-facing base URL. The A2A global agent card handler returns
      # HTTP 500 when unset rather than silently advertising localhost to
      # external consumers; set it here so the dev stack works out of the
      # box. Override in .env for a non-localhost dev setup.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Mount the example bootstrap file and enable it automatically in dev.
      # Remove or override BOOTSTRAP_FILE in .env to disable.
      BOOTSTRAP_FILE: /etc/ai-registry/bootstrap.yaml
    volumes:
      - ./bootstrap.example.yaml:/etc/ai-registry/bootstrap.yaml:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Web (Vite dev server with hot reload) ───────────────────────────────────
  web:
    # The base compose builds web/Dockerfile (nginx) for this service. In dev we
    # run the stock node image with a Vite dev server instead, so drop the
    # inherited build — otherwise Compose builds the nginx image AND tags it
    # `node:24-alpine`, clobbering the real Node image (the container then has
    # nginx, not npm).
    build: !reset null
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    # Install deps on first start (node_modules volume persists across restarts),
    # then launch the Vite dev server.
    # Wait for Keycloak's realm endpoint before starting.
    command: >
      sh -c "
        echo 'Waiting for Keycloak...' &&
        until wget -q -O /dev/null http://keycloak:8080/realms/ai-registry 2>/dev/null; do
          echo 'Keycloak not ready, retrying in 5s...' && sleep 5
        done &&
        echo 'Keycloak ready.' &&
        npm install &&
        npm run dev -- --host
      "
    environment:
      # Vite proxies /api/* and /config.json to the server (see vite.config.ts).
      # The SPA reads its sign-in feature flags at runtime via GET /config.json —
      # no auth values are baked into the image (it is no longer an OIDC client).
      API_URL: http://server:8081
      NODE_ENV: development
      # Polling is required for inotify to work through Docker volume mounts
      # on Linux and WSL2. Has no effect on macOS (native fsevents are used).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Mount source so edits hot-reload without rebuilding the image.
      - ../web:/app
      # Keep node_modules in a named volume so the host copy never shadows
      # the container's installed packages.
      - web_node_modules:/app/node_modules
    # !override replaces the base service's port list instead of concatenating
    # with it. Without this, Compose merges the base mapping (3000:8080, nginx)
    # and this dev mapping (3000:3000, vite) into one container, which then tries
    # to bind host port 3000 twice and fails with "port is already allocated".
    ports: !override
      - "3000:3000"
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  web_node_modules:
