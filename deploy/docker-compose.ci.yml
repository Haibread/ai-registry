name: ai-registry-ci

# CI override — applied on top of docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
#
# Relaxes every depends_on condition to service_started so that
# "docker compose up -d" returns immediately without blocking on Keycloak's
# slow JVM startup.  The GitHub Actions workflow polls each service for
# readiness explicitly before running the Playwright tests.

services:
  server:
    # E2E authenticates the fixture users (admin/author/reviewer/user) via the
    # brokered OIDC flow — they live in Keycloak — and exercises the local
    # email+password front door for the local-login spec. Both end in the
    # registry session cookie, which Playwright captures via storageState
    # (ADR 0006 amendment, 2026-06-01). No bearer token, no localStorage.
    environment:
      # Local front door + a throwaway bootstrap admin for the local-login spec.
      AUTH_LOCAL_LOGIN_ENABLED: "true"
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${E2E_LOCAL_ADMIN_EMAIL}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_LOCAL_ADMIN_PASSWORD}
      # Plain-HTTP CI: the session cookie must not be Secure or the browser
      # drops it and every authenticated request looks signed-out.
      AUTH_SESSION_SECURE: "false"
      # Server-side OIDC broker against the dev realm's confidential client.
      # The browser reaches Keycloak at localhost:8080 (front-channel); the
      # server reaches it at keycloak:8080 for discovery/token/JWKS.
      OIDC_CLIENT_ID: ai-registry-server
      OIDC_CLIENT_SECRET: dev-broker-secret
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ai-registry
      # Seed the dev groups + grants (anthropic-core/labs → anthropic,
      # openai-platform → openai) so the federated `author` resolves to a
      # publisher role via group membership.
      BOOTSTRAP_FILE: /etc/ai-registry/bootstrap.yaml
    volumes:
      - ./bootstrap.example.yaml:/etc/ai-registry/bootstrap.yaml:ro
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_started

  keycloak:
    # Pin the front-channel hostname so the issuer + authorize URL are stably
    # http://localhost:8080 regardless of how Keycloak is reached — required by
    # the server-side broker (it fetches the back-channel via keycloak:8080).
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"

  web:
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_started
