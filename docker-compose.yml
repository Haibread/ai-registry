name: ai-registry

# Unified local stack — replaces the former docker-compose.yml +
# docker-compose.dev.yml pair. The web frontend ships in two mutually
# exclusive flavours, each behind a profile:
#
#   docker compose --profile dev  up -d --build   # Vite dev server, hot reload
#   docker compose --profile prod up -d --build   # nginx image built from web/Dockerfile
#
# Core services (postgres, keycloak, server) have no profile, so they start
# under either flavour. Add the observability profile for traces:
#
#   docker compose --profile dev --profile observability up -d --build
#
# Config files (realm import, bootstrap sample, OTel config) live under
# deploy/; the optional .env (see deploy/.env.example) is loaded if present.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    # In 18+ the official image stores data in a major-version-specific
    # subdirectory under /var/lib/postgresql, so the volume must mount the
    # parent. Mounting /var/lib/postgresql/data directly causes the
    # "unused mount/volume" startup error documented in
    # https://github.com/docker-library/postgres/pull/1259.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak (dev mode, built-in H2 DB) ─────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the front-channel hostname so the issuer + authorize URL are stably
      # http://localhost:8080 no matter how Keycloak is reached. The registry
      # broker fetches discovery/token/JWKS over the internal keycloak:8080 host
      # (OIDC_INTERNAL_URL) while the browser uses localhost:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak-realm-dev.json:/opt/keycloak/data/import/ai-registry-realm.json:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      # Keycloak is a JVM app — it can take 60-120 s to boot on a cold runner.
      # The image ships neither curl nor wget, so probe readiness with a bash
      # /dev/tcp connection: Quarkus opens :8080 only after the realm import
      # completes ("Listening on" is the last boot line), so an accepted
      # connection is a sound readiness signal.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Server ───────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    # Optional overrides — loaded only if deploy/.env exists (see
    # deploy/.env.example). Every value below has an inline default, so the
    # stack runs with no .env at all.
    env_file:
      - path: ./deploy/.env
        required: false
    environment:
      # OIDC is brokered server-side with a single CONFIDENTIAL client; it is
      # enabled because BOTH OIDC_CLIENT_ID and OIDC_CLIENT_SECRET are set below
      # (the `ai-registry-server` broker client from keycloak-realm-dev.json).
      # The browser hits Keycloak at localhost:8080 (front-channel); the server
      # reaches it at keycloak:8080 for discovery/token/JWKS via OIDC_INTERNAL_URL.
      # KC_HOSTNAME (above) pins the issuer so the two views agree. Set
      # OIDC_CLIENT_SECRET="" in .env to disable OIDC and fall back to local login.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/ai-registry}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://keycloak:8080/realms/ai-registry}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ai-registry-server}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-broker-secret}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/ai-registry/protocol/openid-connect/certs}
      # RBAC + change-approval auth knobs. Defaults match the server's built-in
      # fallbacks, so the keys only need to be set in .env for a custom IdP.
      AUTH_GROUPS_CLAIM: ${AUTH_GROUPS_CLAIM:-groups}
      AUTH_REVIEWER_GROUP: ${AUTH_REVIEWER_GROUP:-registry-reviewers}
      # Local email+password login — the out-of-the-box front door. ON by
      # default so the stack is usable with no IdP. Logging in needs an account:
      # the bootstrap admin below is seeded on first boot.
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      # Bootstrap Server Admin seeded on first boot (create-only — never
      # overwrites an existing account). These are DEV credentials; rotate /
      # override in .env for any shared environment.
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-devadmin12345}
      # Auth is a bearer token (no cookie). No signing key is set here, so the
      # server generates an ephemeral key at boot — fine for dev. In prod set
      # JWT_SIGNING_KEY (PEM) or JWT_SIGNING_SEED (secret string, >= 32 chars).
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_SEED: ${JWT_SIGNING_SEED:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://registry:registry@postgres:5432/registry?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Public-facing base URL. The A2A global agent card handler returns
      # HTTP 500 when unset rather than silently advertising localhost to
      # external consumers; set it here so the stack works out of the box.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Mount the example bootstrap file and enable it automatically. Remove or
      # override BOOTSTRAP_FILE in .env to disable.
      BOOTSTRAP_FILE: ${BOOTSTRAP_FILE:-/etc/ai-registry/bootstrap.yaml}
      # Config-managed instance tags (JSON array; see deploy/config.example.yaml).
      # Empty → the vocabulary is curated solely through the admin UI.
      INSTANCE_TAGS: ${INSTANCE_TAGS:-}
    volumes:
      - ./deploy/bootstrap.example.yaml:/etc/ai-registry/bootstrap.yaml:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Web (dev: Vite dev server with hot reload) ──────────────────────────────
  # Profile: dev. Mounts ../web and runs `vite dev`, so any save hot-reloads.
  # Vite proxies /api/* and /config.json to the server (see vite.config.ts).
  web:
    profiles: [dev]
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    # Wait for Keycloak's realm endpoint, install deps (node_modules volume
    # persists across restarts), then launch the Vite dev server.
    command: >
      sh -c "
        echo 'Waiting for Keycloak...' &&
        until wget -q -O /dev/null http://keycloak:8080/realms/ai-registry 2>/dev/null; do
          echo 'Keycloak not ready, retrying in 5s...' && sleep 5
        done &&
        echo 'Keycloak ready.' &&
        npm install &&
        npm run dev -- --host
      "
    environment:
      # Vite proxies /api/* and /config.json to the server (see vite.config.ts).
      # The SPA reads its sign-in feature flags at runtime via GET /config.json —
      # no auth values are baked into the image (it is no longer an OIDC client).
      API_URL: http://server:8081
      NODE_ENV: development
      # Polling is required for inotify to work through Docker volume mounts on
      # Linux and WSL2. Has no effect on macOS (native fsevents are used).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Mount source so edits hot-reload without rebuilding the image.
      - ./web:/app
      # Keep node_modules in a named volume so the host copy never shadows the
      # container's installed packages.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_started

  # ── Web (prod: Vite SPA built and served by nginx) ──────────────────────────
  # Profile: prod. Builds web/Dockerfile (nginx) — the production image. nginx
  # proxies /api/, /config.json, etc. to the server upstream.
  web-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: "http://server:8081"
    ports:
      - "3000:8080"
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_healthy

  # ── OTel Collector (observability profile) ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    profiles: [observability]
    restart: unless-stopped
    command: --config /etc/otel/config.yaml
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # ── Jaeger (observability profile) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.65
    profiles: [observability]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4319:4317"    # OTLP gRPC (offset to avoid conflict with collector)

volumes:
  postgres_data:
  web_node_modules:
