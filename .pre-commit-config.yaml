# Pre-commit hooks for the AI Registry monorepo (Go server + Vite/React web +
# Helm chart + Docker + GitHub Actions). See https://pre-commit.com.
#
# One-time setup:
#   pre-commit install            # enable the pre-commit and commit-msg hooks
#   pre-commit run --all-files    # run every hook across the whole tree
#
# The baseline, gitleaks, yamllint and sqlfluff hooks are fetched and managed
# by pre-commit. The other language/tool linters are `language: system` hooks
# that shell out to binaries you must have on PATH:
#   - Go:     go (gofmt ships with the toolchain), golangci-lint
#   - Web:    node + npm (run `npm ci` in web/ and docs/ first)
#   - Helm:   helm, helm-docs
#   - Docker: hadolint
#   - CI:     actionlint
# See CONTRIBUTING.md for install commands.

minimum_pre_commit_version: "3.2.0"

default_install_hook_types:
  - pre-commit
  - commit-msg

# Keeps the file linters from also running on the commit message file.
default_stages:
  - pre-commit

repos:
  # ── Baseline (managed by pre-commit) ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Generated from openapi.yaml via `npm run generate`; never hand-edited.
        exclude: ^web/src/lib/schema\.d\.ts$
      - id: end-of-file-fixer
        exclude: ^web/src/lib/schema\.d\.ts$
      - id: check-yaml
        args:
          - --allow-multiple-documents
        # Helm templates are Go-templated — not valid standalone YAML under
        # PyYAML's safe loader.
        exclude: ^deploy/helm/.*/templates/
      - id: check-added-large-files
        exclude: ^docs/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Secret scanning (managed by pre-commit) ─────────────────────────────────
  # detect-private-key (above) only catches PEM headers; gitleaks catches API
  # key patterns from dozens of providers.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── YAML style (managed by pre-commit) ──────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Without --strict, warning-level findings print and the hook passes.
        args:
          - --strict
        exclude: ^deploy/helm/.*/templates/

  # ── Shell (managed by pre-commit) ───────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # ── SQL (managed by pre-commit) ─────────────────────────────────────────────
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        # Migrations 000001–000023 predate the linter and merged migrations are
        # never edited, so only newer ones are held to .sqlfluff.
        exclude: ^server/migrations/0000(0[1-9]|1[0-9]|2[0-3])_

  # ── Local tool hooks (binaries must be on PATH) ─────────────────────────────
  - repo: local
    hooks:
      # ── Commit message ────────────────────────────────────────────────────────
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg

      # ── Go ──────────────────────────────────────────────────────────────────
      - id: gofmt
        name: gofmt
        description: Format Go files with gofmt.
        entry: gofmt
        args:
          - -l
          - -w
        language: system
        types:
          - go
      - id: go-vet
        name: go vet
        description: Report suspicious constructs in the Go module.
        entry: bash -c 'cd server && go vet ./...'
        language: system
        types:
          - go
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        description: Run the golangci-lint meta-linter over the Go module.
        entry: bash -c 'cd server && golangci-lint run'
        language: system
        types:
          - go
        pass_filenames: false

      # ── Web (Vite + React) ────────────────────────────────────────────────────
      - id: web-eslint
        name: eslint (web)
        description: Lint the web sources with ESLint.
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: web-tsc
        name: tsc --noEmit (web)
        description: Type-check the web sources (noEmit via tsconfig project refs).
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false

      # ── Docs site (Starlight) ─────────────────────────────────────────────────
      - id: docs-biome
        name: biome (docs)
        description: Lint and format-check the docs site with Biome.
        entry: npm --prefix docs run lint
        language: system
        files: ^docs/
        pass_filenames: false
      - id: docs-astro-check
        name: astro check (docs)
        description: Type-check the docs site and its content frontmatter.
        entry: npm --prefix docs run check
        language: system
        files: ^docs/
        pass_filenames: false

      # ── Helm ──────────────────────────────────────────────────────────────────
      - id: helm-lint
        name: helm lint
        description: Lint the ai-registry Helm chart.
        entry: helm lint deploy/helm/ai-registry
        language: system
        files: ^deploy/helm/ai-registry/
        pass_filenames: false
      - id: helm-docs
        name: helm-docs
        description: Regenerate the chart README from values.yaml.
        entry: bash -c 'cd deploy/helm/ai-registry && helm-docs'
        language: system
        files: ^deploy/helm/ai-registry/(Chart\.yaml|values\.yaml|README\.md|templates/)
        pass_filenames: false

      # ── Docker ────────────────────────────────────────────────────────────────
      - id: hadolint
        name: hadolint
        description: Lint Dockerfiles.
        entry: hadolint
        language: system
        files: (^|/)Dockerfile$

      # ── GitHub Actions ─────────────────────────────────────────────────────────
      - id: actionlint
        name: actionlint
        description: Lint GitHub Actions workflow files.
        # GitHub added `command`/`entrypoint` to service containers (June 2026);
        # actionlint v1.7.12 (latest) doesn't know them yet and flags them as
        # unexpected keys. Ignore that one message until a release catches up.
        entry: actionlint -ignore 'unexpected key "(command|entrypoint)" for "services" section'
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
